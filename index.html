<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>มีอะไรอยากให้บิบิ๋ดูหน่อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF8F0;
    --pink:#FFD9E1;
    --pink-deep:#F6AEC0;
    --plum:#5B3049;
    --rose:#E85D75;
    --gold:#D8A468;
    --sage:#93A480;
    --shadow: 0 18px 40px -18px rgba(91,48,73,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, #FFF0E9 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #FFE3EC 0%, transparent 50%),
      linear-gradient(160deg, #FFEDE4 0%, var(--pink) 55%, var(--pink-deep) 100%);
    font-family:'Prompt', sans-serif;
    color:var(--plum);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    padding:24px;
  }

  .hearts-bg{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .drift-heart{
    position:absolute; bottom:-40px; font-size:18px; opacity:.55;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 2px 3px rgba(91,48,73,0.15));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:.6;}
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0;}
  }

  .scene{ position:relative; z-index:1; width:100%; max-width:460px; }

  .stage{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .hidden{ display:none !important; }

  /* ---------- Envelope ---------- */
  .envelope-wrap{
    perspective:1200px;
    margin-bottom:28px;
  }
  .envelope{
    width:220px; height:150px;
    position:relative;
    cursor:pointer;
    transform-origin:center;
    transition: transform .35s ease;
  }
  .envelope:hover{ transform: translateY(-4px) scale(1.02); }

  .env-body{
    position:absolute; inset:0;
    background: linear-gradient(155deg, var(--paper), #FFEFE1);
    border-radius:10px;
    box-shadow: var(--shadow);
  }
  .env-shade{
    position:absolute; left:0; right:0; bottom:0; height:100%;
    background:
      linear-gradient(135deg, transparent 49.6%, rgba(91,48,73,0.06) 50%, transparent 50.4%),
      linear-gradient(-135deg, transparent 49.6%, rgba(91,48,73,0.06) 50%, transparent 50.4%);
    border-radius:10px;
  }
  .env-flap{
    position:absolute; top:0; left:0; width:100%; height:75px;
    background: linear-gradient(160deg, var(--pink-deep), var(--rose));
    clip-path: polygon(0 0, 50% 68%, 100% 0);
    transform-origin: top center;
    transition: transform .7s cubic-bezier(.6,0,.3,1);
    border-radius: 10px 10px 0 0;
    z-index:3;
  }
  .envelope.open .env-flap{
    transform: rotateX(180deg);
    z-index:1;
  }
  .seal{
    position:absolute; top:38px; left:50%; transform:translateX(-50%);
    width:38px; height:38px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8fa3, var(--rose));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 4px 8px rgba(91,48,73,0.25);
    z-index:4; transition: opacity .3s ease, transform .3s ease;
  }
  .envelope.open .seal{ opacity:0; transform:translateX(-50%) scale(.4); }

  .letter-peek{
    position:absolute; left:14px; right:14px; bottom:10px; top:20px;
    background: var(--paper);
    border-radius:6px;
    box-shadow:0 -2px 6px rgba(91,48,73,0.08);
    z-index:2;
    transform: translateY(0);
    transition: transform .6s ease .1s;
  }
  .envelope.open .letter-peek{ transform: translateY(-56px); }

  .prompt-text{
    font-family:'Mali', sans-serif; font-weight:600;
    font-size:1.35rem; margin:4px 0 18px; color:var(--plum);
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Prompt', sans-serif; font-weight:600; font-size:0.98rem;
    padding:13px 30px; border-radius:999px; border:none; cursor:pointer;
    transition: transform .38s cubic-bezier(.34,1.4,.64,1), box-shadow .18s ease, background .2s ease;
  }
  @keyframes wiggle{
    0%,100%{ transform: translateX(0) scale(var(--no-scale,1)); }
    25%{ transform: translateX(-4px) scale(var(--no-scale,1)); }
    75%{ transform: translateX(4px) scale(var(--no-scale,1)); }
  }
  .btn-ghost.wiggle{ animation: wiggle .32s ease; }
  .btn-primary{
    background: linear-gradient(135deg, var(--rose), var(--pink-deep));
    color:#fff; box-shadow:0 10px 22px -8px rgba(232,93,117,0.55);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 14px 26px -8px rgba(232,93,117,0.65); }
  .btn-ghost{
    background:transparent; color:var(--plum); border:1.5px solid rgba(91,48,73,0.35);
  }
  .btn-ghost:hover{ background:rgba(91,48,73,0.06); }

  /* ---------- Letter stage ---------- */
  .letter-card{
    background: var(--paper);
    border-radius:18px;
    padding:34px 28px 28px;
    box-shadow: var(--shadow);
    max-width:400px;
    position:relative;
    animation: unfold .5s ease;
  }
  @keyframes unfold{
    from{ opacity:0; transform: translateY(18px) scale(.96); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .letter-card::before{
    content:"";
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:46px; height:3px; border-radius:3px;
    background: var(--gold); opacity:.5;
  }
  .letter-text{
    font-family:'Mali', sans-serif; font-size:1.18rem; line-height:1.9;
    color:var(--plum); white-space:pre-line; margin:18px 0 26px;
    min-height:110px; display:flex; align-items:center; justify-content:center;
  }
  .letter-text.fade{ animation: textFade .45s ease; }
  @keyframes textFade{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .page-dots{ display:flex; gap:7px; justify-content:center; margin-bottom:6px; }
  .page-dots span{
    width:7px; height:7px; border-radius:50%;
    background: rgba(91,48,73,0.18);
    transition: background .3s ease, transform .3s ease;
  }
  .page-dots span.active{ background: var(--rose); transform:scale(1.35); }
  .choice-buttons{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* ---------- Result stages ---------- */
  .result-card{
    background: var(--paper); border-radius:18px; padding:40px 30px;
    box-shadow: var(--shadow); max-width:380px;
    animation: pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{
    from{ opacity:0; transform: scale(.8); }
    to{ opacity:1; transform: scale(1); }
  }
  .result-emoji{ font-size:3rem; margin-bottom:6px; }
  .result-title{
    font-family:'Mali', sans-serif; font-weight:700; font-size:1.6rem;
    color:var(--rose); margin:6px 0 8px;
  }
  .result-sub{ font-size:0.95rem; color:var(--plum); opacity:.8; line-height:1.7; }

  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:2; }
  .confetti span{
    position:absolute; top:-30px; font-size:20px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(400deg); opacity:.9; }
  }

  .retry-link{
    margin-top:18px; background:none; border:none; text-decoration:underline;
    color:var(--plum); opacity:.6; font-family:'Prompt',sans-serif; font-size:.85rem; cursor:pointer;
  }
  .retry-link:hover{ opacity:1; }

  @media (max-width:420px){
    .envelope{ width:190px; height:130px; }
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="scene">

  <!-- Stage 1: Envelope -->
  <div class="stage" id="stageEnvelope">
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="env-body"></div>
        <div class="env-shade"></div>
        <div class="letter-peek"></div>
        <div class="env-flap"></div>
        <div class="seal">♡</div>
      </div>
    </div>
    <p class="prompt-text">มีอะไรอยากให้บิบิ๋ดูหน่อย</p>
    <button class="btn btn-primary" id="openBtn">เปิดดูสิ</button>
  </div>

  <!-- Stage 2: Letter with paged messages -->
  <div class="stage hidden" id="stageLetter">
    <div class="letter-card">
      <div class="page-dots" id="pageDots"></div>
      <p class="letter-text" id="letterText"></p>
      <button class="btn btn-primary" id="nextPageBtn">ต่อไป</button>
      <div class="choice-buttons hidden" id="choiceButtons">
        <button class="btn btn-primary" id="yesBtn">ตกลงเป็นแฟนกัน</button>
        <button class="btn btn-ghost" id="noBtn">ยังไม่เป็นด้วยหรอก</button>
      </div>
    </div>
  </div>

  <!-- Stage 3a: Yes result -->
  <div class="stage hidden" id="stageYes">
    <div class="result-card">
      <div class="result-emoji">🥰💕</div>
      <div class="result-title">เย้! บิบิ๋เป็นแฟนเค้าแล้ว</div>
      <p class="result-sub">ต่อไปนี้เราดูแลกันและกันนะ 🎉🐻💗</p>
    </div>
  </div>

  <!-- Stage 3b: No result -->
  <div class="stage hidden" id="stageNo">
    <div class="result-card">
      <div class="result-emoji">🥺💧</div>
      <div class="result-title">อ๋อ...งั้นก็ได้</div>
      <p class="result-sub">เดี๋ยวเค้ารออยู่นะ 💔<br>ถามใหม่ทีหลังละกัน...</p>
      <button class="retry-link" id="retryBtn">อ่านจดหมายอีกที</button>
    </div>
  </div>

</div>

<script>
  const heartsBg = document.getElementById('heartsBg');
  const heartChars = ['💗','🩷','💕','♡'];
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'drift-heart';
    h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.setProperty('--drift', (Math.random()*80-40) + 'px');
    h.style.animationDuration = (7 + Math.random()*5) + 's';
    h.style.fontSize = (14 + Math.random()*14) + 'px';
    heartsBg.appendChild(h);
    setTimeout(()=>h.remove(), 13000);
  }
  setInterval(spawnHeart, 900);
  for(let i=0;i<5;i++) setTimeout(spawnHeart, i*300);

  const stageEnvelope = document.getElementById('stageEnvelope');
  const stageLetter = document.getElementById('stageLetter');
  const stageYes = document.getElementById('stageYes');
  const stageNo = document.getElementById('stageNo');
  const envelope = document.getElementById('envelope');

  function showOnly(el){
    [stageEnvelope, stageLetter, stageYes, stageNo].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  // ---------- Paged letter ----------
  const pages = [
    "ถึงบิบิ๋คนพิเศษ 💌\n\nมีอะไรอยากบอกอยู่นะ\nแอบตั้งใจเขียนมาหลายรอบเลย",
    "บิบิ๋รู้ไหมว่าเวลายิ้ม\nมันทำให้วันแย่ๆ ของเค้า\nดีขึ้นทันทีเลย 🥹💗",
    "เวลาบิบิ๋หัวเราะ\nเสียงมันน่ารักจนเค้า\nอดยิ้มตามไม่ได้เลยนะ 😊",
    "แค่มีบิบิ๋อยู่ใกล้ๆ\nเค้าก็รู้สึกอุ่นใจแปลกๆ\nทุกทีเลยนะ 🤎",
    "บิบิ๋เป็นคนพิเศษที่สุด\nเท่าที่เค้าเคยเจอมาเลยจริงๆ ✨",
    "เก็บมาคิดอยู่นานเลยนะ\nว่าจะบอกยังไงดี...\n\nบิบิ๋... เป็นแฟนกับเค้านะ? 🥺💗"
  ];
  let pageIndex = 0;

  const letterText = document.getElementById('letterText');
  const pageDots = document.getElementById('pageDots');
  const nextPageBtn = document.getElementById('nextPageBtn');
  const choiceButtons = document.getElementById('choiceButtons');

  pages.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === 0) dot.classList.add('active');
    pageDots.appendChild(dot);
  });

  function renderPage(){
    letterText.textContent = pages[pageIndex];
    letterText.classList.remove('fade');
    void letterText.offsetWidth;
    letterText.classList.add('fade');

    [...pageDots.children].forEach((d, i) => d.classList.toggle('active', i === pageIndex));

    const isLast = pageIndex === pages.length - 1;
    nextPageBtn.classList.toggle('hidden', isLast);
    choiceButtons.classList.toggle('hidden', !isLast);
  }

  function resetLetter(){
    pageIndex = 0;
    renderPage();
  }

  nextPageBtn.addEventListener('click', () => {
    if (pageIndex < pages.length - 1){
      pageIndex++;
      renderPage();
    }
  });

  function openEnvelope(){
    envelope.classList.add('open');
    resetLetter();
    setTimeout(()=> showOnly(stageLetter), 650);
  }

  document.getElementById('openBtn').addEventListener('click', openEnvelope);
  envelope.addEventListener('click', openEnvelope);

  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  let noClicks = 0;

  function resetChoiceButtons(){
    noClicks = 0;
    yesBtn.style.transform = 'scale(1)';
    noBtn.style.transform = 'scale(1)';
  }

  yesBtn.addEventListener('click', () => {
    showOnly(stageYes);
    burstConfetti();
  });

  noBtn.addEventListener('click', () => {
    noClicks++;
    if (noClicks < 3){
      const yesScale = 1 + noClicks * 0.3;   // 1.3, 1.6
      const noScale = Math.max(1 - noClicks * 0.3, 0.35); // 0.7, 0.4
      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.setProperty('--no-scale', noScale);
      noBtn.style.transform = `scale(${noScale})`;
      noBtn.classList.remove('wiggle');
      void noBtn.offsetWidth; // restart animation
      noBtn.classList.add('wiggle');
      return;
    }
    showOnly(stageNo);
    resetChoiceButtons();
  });

  document.getElementById('retryBtn').addEventListener('click', () => {
    resetChoiceButtons();
    resetLetter();
    showOnly(stageLetter);
  });

  function burstConfetti(){
    const layer = document.createElement('div');
    layer.className = 'confetti';
    document.body.appendChild(layer);
    const emojis = ['💗','🎉','💕','🩷','✨'];
    for(let i=0;i<28;i++){
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = Math.random()*100 + 'vw';
      s.style.animationDuration = (2.2 + Math.random()*1.8) + 's';
      s.style.animationDelay = (Math.random()*0.6) + 's';
      layer.appendChild(s);
    }
    setTimeout(()=>layer.remove(), 4500);
  }
</script>
</body>
</html>
